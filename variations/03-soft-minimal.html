<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direction 03 — Soft Minimal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f6f7f9; color: #1f2937; font-family: 'Plus Jakarta Sans', sans-serif; }
    .page { display: flex; flex-direction: column; align-items: center; padding-bottom: 72px; }

    /* Header — centered, airy */
    .header { width: 100%; max-width: 760px; text-align: center; padding: 64px 24px 12px; }
    .wordmark { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -0.2px; color: #111827; }
    .pill { font-size: 11px; font-weight: 600; color: #2563eb; background: #e8f0fe; padding: 3px 9px; border-radius: 999px; }
    .tagline { font-size: 24px; font-weight: 600; line-height: 1.4; margin-top: 22px; letter-spacing: -0.4px; }
    .tagline span { color: #6b7280; font-weight: 500; }
    .credit { font-size: 14px; color: #6b7280; margin-top: 14px; }
    .credit b { color: #2563eb; font-weight: 600; }

    /* Gallery — soft cards */
    .gallery { display: flex; gap: 20px; width: 100%; max-width: 1600px; padding: 44px 32px 0; }
    .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
    .card { aspect-ratio: var(--r); border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 8px 24px rgba(16,24,40,0.06); transition: transform .25s ease, box-shadow .25s ease; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 2px 4px rgba(16,24,40,0.06), 0 16px 40px rgba(16,24,40,0.10); }
    .card img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* Footer */
    .footer { width: 100%; max-width: 1600px; padding: 48px 32px 0; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .footer span { font-size: 13px; color: #9ca3af; font-weight: 500; }

    @media (max-width: 1024px) {
      .gallery { display: block; column-count: 2; column-gap: 20px; }
      .col { display: contents; }
      .card { break-inside: avoid; margin-bottom: 20px; }
    }
    @media (max-width: 600px) { .gallery { column-count: 1; } .tagline { font-size: 20px; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="wordmark">INTERFACE?LAB. <span class="pill">v1.0</span></div>
      <h1 class="tagline">Shelter for design explorations <span>and prototypes</span></h1>
      <p class="credit">All work crafted by <b>@Atharva Chavare</b></p>
    </header>

    <section class="gallery">
      <div class="col">
        <figure class="card" style="--r: 460/461.69"><img src="../assets/pull-to-reload.gif" alt="Pull To Reload" /></figure>
        <figure class="card" style="--r: 460/248.81"><img src="../assets/stacked-cards-v2.gif" alt="Stacked Cards v2" /></figure>
        <figure class="card" style="--r: 460/259.83"><img src="../assets/sticker.png" alt="Sticker" /></figure>
      </div>
      <div class="col">
        <figure class="card" style="--r: 460/804.98"><img src="../assets/wallet.gif" alt="Wallet" /></figure>
      </div>
      <div class="col">
        <figure class="card" style="--r: 460/355.81"><img src="../assets/folded-email.gif" alt="Folded Email" /></figure>
        <figure class="card" style="--r: 460/366.77"><img src="../assets/search-input.gif" alt="Search Input" /></figure>
      </div>
      <div class="col">
        <figure class="card" style="--r: 460/461.69"><img src="../assets/animated-switch.gif" alt="Animated Switch" /></figure>
        <figure class="card" style="--r: 460/406.11"><img src="../assets/folded-email-2.gif" alt="Folded Email" /></figure>
      </div>
    </section>

    <footer class="footer">
      <span>Built with Next.js + Vercel</span>
      <span>© 2026, Atharva Chavare</span>
    </footer>
  </main>
</body>
</html>
