<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direction 04 — Dark Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0b0c; color: #ededed; font-family: 'Space Grotesk', sans-serif; }
    .page { display: flex; flex-direction: column; align-items: center; padding-bottom: 80px; }

    /* Header */
    .header { width: 100%; max-width: 1760px; padding: 40px 40px 28px; display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid #1c1c1f; }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .wordmark { font-weight: 700; font-size: 17px; letter-spacing: -0.3px; }
    .ver { font-size: 13px; color: #6b6b70; }
    .tagline { font-size: 15px; color: #9a9aa0; max-width: 460px; }
    .tagline b { color: #f4f4f5; font-weight: 600; }
    .credit { font-size: 15px; color: #9a9aa0; }
    .credit b { color: #6ea8fe; font-weight: 600; }

    /* Gallery */
    .gallery { display: flex; gap: 16px; width: 100%; max-width: 1760px; padding: 36px 40px 0; }
    .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
    .card { aspect-ratio: var(--r); border: 1px solid #1c1c1f; border-radius: 12px; overflow: hidden; background: #141416; transition: border-color .25s ease; }
    .card:hover { border-color: #34343a; }
    .card img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* Footer */
    .footer { width: 100%; max-width: 1760px; padding: 48px 40px 0; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .footer span { font-size: 13px; color: #6b6b70; }

    @media (max-width: 1024px) {
      .gallery { display: block; column-count: 2; column-gap: 16px; }
      .col { display: contents; }
      .card { break-inside: avoid; margin-bottom: 16px; }
    }
    @media (max-width: 600px) { .gallery { column-count: 1; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="brand"><span class="wordmark">INTERFACE?LAB.</span><span class="ver">v1.0</span></div>
      <p class="tagline">Shelter for <b>design explorations</b> and <b>prototypes</b></p>
      <p class="credit">All work crafted by <b>@Atharva Chavare</b></p>
    </header>

    <section class="gallery">
      <div class="col">
        <figure class="card" style="--r: 460/461.69"><img src="../assets/pull-to-reload.gif" alt="Pull To Reload" /></figure>
        <figure class="card" style="--r: 460/248.81"><img src="../assets/stacked-cards-v2.gif" alt="Stacked Cards v2" /></figure>
        <figure class="card" style="--r: 460/259.83"><img src="../assets/sticker.png" alt="Sticker" /></figure>
      </div>
      <div class="col">
        <figure class="card" style="--r: 460/804.98"><img src="../assets/wallet.gif" alt="Wallet" /></figure>
      </div>
      <div class="col">
        <figure class="card" style="--r: 460/355.81"><img src="../assets/folded-email.gif" alt="Folded Email" /></figure>
        <figure class="card" style="--r: 460/366.77"><img src="../assets/search-input.gif" alt="Search Input" /></figure>
      </div>
      <div class="col">
        <figure class="card" style="--r: 460/461.69"><img src="../assets/animated-switch.gif" alt="Animated Switch" /></figure>
        <figure class="card" style="--r: 460/406.11"><img src="../assets/folded-email-2.gif" alt="Folded Email" /></figure>
      </div>
    </section>

    <footer class="footer">
      <span>Built with Next.js + Vercel</span>
      <span>© 2026, Atharva Chavare</span>
    </footer>
  </main>
</body>
</html>
