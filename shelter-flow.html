<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shelter for Design &amp; Interactions — Flow</title>
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shelter-flow.css" />
  <script src="shelter-flow.js" defer></script>
</head>
<body>
  <div class="bg-glow"></div>

  <header class="nav">
    <div class="nav__brand"><span class="dot"></span> INTERFACE?LAB</div>
    <div class="nav__meta">Internal · v1.0</div>
  </header>

  <div class="track" id="track">
    <div class="scene" id="scene">

      <img class="cloud cloud--left"  id="cloudL" src="assets/cloud-left.png"  alt="" />
      <img class="cloud cloud--right" id="cloudR" src="assets/cloud-right.png" alt="" />

      <div class="stage" id="stage">
        <h1 class="headline" id="headline">
          <span class="headline__a">Shelter for</span>
          <span class="headline__b">Design &amp; Interactions</span>
        </h1>

        <div class="bento" id="bento">
          <div class="bento__left">
            <button class="card" data-key="pull"><img src="assets/pull-to-reload.gif" alt="Pull To Reload"><span>Pull To Reload</span></button>
            <button class="card" data-key="stacked"><img src="assets/stacked-cards-v2.gif" alt="Stacked Cards"><span>Stacked Cards</span></button>
            <button class="card" data-key="folded"><img src="assets/folded-email.gif" alt="Folded Email"><span>Folded Email</span></button>
            <button class="card" data-key="search"><img src="assets/search-input.gif" alt="Search Input"><span>Search Input</span></button>
            <button class="card" data-key="switch"><img src="assets/animated-switch.gif" alt="Animated Switch"><span>Animated Switch</span></button>
            <button class="card" data-key="folded2"><img src="assets/folded-email-2.gif" alt="Folded Email"><span>Folded Email</span></button>
          </div>

          <div class="phone" id="phone">
            <div class="phone__screen">
              <div class="scr scr--lock" id="scrLock">
                <div class="wallpaper"></div>
                <div class="statusbar"><span>9:41</span><span class="sb-ic"><i></i><i></i><i class="b"></i></span></div>
                <div class="di" id="di"><div class="di__inner" id="diInner"></div></div>
                <div class="clock"><div class="clock__date" id="clockDate">Saturday, 14 June</div><div class="clock__time">9:41</div></div>
                <div class="notes">
                  <article class="note"><span class="ni ic-claude">✳</span><div class="nb"><b>Claude Code</b><span>Build complete · 0 errors</span></div><span class="nt">now</span></article>
                  <article class="note"><span class="ni ic-vercel">▲</span><div class="nb"><b>Vercel</b><span>Deployed to production</span></div><span class="nt">1m</span></article>
                </div>
                <div class="dock"><div class="dock__handle"></div></div>
              </div>
              <div class="scr scr--wallet" id="scrWallet"><img src="assets/wallet.gif" alt="Wallet" /></div>
            </div>
          </div>
        </div>
      </div>

      <div class="scrollcue" id="scrollcue"><span>Scroll</span><span class="scrollcue__arrow">↓</span></div>
    </div>
  </div>

  <footer class="footer">
    <span>Built with React · Next.js · Claude Code</span>
    <span>© 2026, Atharva Chavare</span>
  </footer>
</body>
</html>
