<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shelter for Design &amp; Interactions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shelter.css" />
  <link rel="stylesheet" href="interactions/value-scroller.css" />
  <link rel="stylesheet" href="interactions/recharge-card.css" />
  <link rel="stylesheet" href="interactions/drag-orb.css" />
  <link rel="stylesheet" href="interactions/calendar-booking.css" />
  <link rel="stylesheet" href="footer.css" />
  <script src="interactions/value-scroller.js" defer></script>
  <script src="interactions/recharge-card.js" defer></script>
  <script src="interactions/drag-orb.js" defer></script>
  <script src="interactions/calendar-booking.js" defer></script>
  <script src="shelter.js" defer></script>
</head>
<body>
  <main class="canvas" aria-label="Shelter for Design and Interactions">
    <div class="composition" id="composition">
      <div class="phone" id="phone">
        <div class="phone__device">
          <svg class="phone__strokes" id="phoneStrokes" viewBox="0 0 393 566.258" aria-hidden="true">
            <!-- Outer dashed stroke — traces bottom-left → up → right → down -->
            <path
              id="strokeOuter"
              class="stroke-path stroke-path--outer"
              fill="none"
              stroke="var(--stroke-outer, #D9D9D9)"
              stroke-width="1.414"
              stroke-dasharray="1.41 1.41"
              vector-effect="non-scaling-stroke"
            />
            <!-- Inner grey rings — Figma 1037:725 / 1037:726 -->
            <path
              id="strokeRingOuter"
              class="stroke-path stroke-path--ring"
              fill="none"
              stroke="#efefef"
              stroke-width="1.127"
              vector-effect="non-scaling-stroke"
            />
            <path
              id="strokeRingInner"
              class="stroke-path stroke-path--ring"
              fill="none"
              stroke="#efefef"
              stroke-width="1.127"
              vector-effect="non-scaling-stroke"
            />
          </svg>

          <div class="phone__island intro-reveal" id="phoneIsland" data-reveal="0" aria-hidden="true"></div>

          <div class="phone__content" id="phoneContent">
            <div class="mock-card mock-card--curve intro-reveal" data-reveal="1">
              <svg class="curve-art" id="curveEditor" viewBox="0 0 146 162" role="img" aria-label="Interactive cubic-bezier easing curve">
                <path class="curve-frame" id="frameRect"></path>
                <path class="curve-diag" id="frameDiag"></path>
                <path class="curve-handle-line" id="handleLine1"></path>
                <path class="curve-handle-line" id="handleLine2"></path>
                <path class="curve-path" id="curvePath"></path>
                <circle class="curve-anchor" id="anchor0" r="3.5"></circle>
                <circle class="curve-anchor" id="anchor3" r="3.5"></circle>
                <circle class="curve-ctrl" id="ctrl1" r="8"></circle>
                <circle class="curve-ctrl" id="ctrl2" r="8"></circle>
              </svg>
            </div>

            <div class="mock-card mock-card--stack intro-reveal" data-reveal="2">
              <p class="stack__title">Tool stack</p>
              <ul class="stack__list">
                <li><img class="stack__check" src="assets/check-blue.svg" alt="" width="15" height="15" />Framer Motion</li>
                <li><img class="stack__check" src="assets/check-blue.svg" alt="" width="15" height="15" />Cursor</li>
                <li><img class="stack__check" src="assets/check-blue.svg" alt="" width="15" height="15" />Next.js</li>
                <li><img class="stack__check" src="assets/check-blue.svg" alt="" width="15" height="15" />Vercel</li>
                <li><img class="stack__check" src="assets/check-blue.svg" alt="" width="15" height="15" />DialKit</li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <div class="blob blob--blue" id="blobBlue" aria-hidden="true">
        <div class="blob__react">
          <svg class="blob__svg" viewBox="0 0 157 169" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="blob__body" d="M10.7315 18.8759C-8.44679 34.972 2.16385 56.7929 11.1537 65.9254L12.0098 76.6275C4.87506 88.614 -2.28826 117.981 27.8491 137.844C35.2726 143.864 55.9405 154.783 77.5121 152.011C83.9334 158.004 98.7452 169.648 106.622 168.278C114.499 166.908 115.612 148.586 115.184 139.596C130.595 128.637 135.589 111.057 136.16 103.637C141.582 100.641 152.427 91.7363 152.427 80.0924C152.427 68.4484 141.582 60.9712 136.16 58.688C138.586 52.124 141.04 36.1707 131.451 24.8692C121.862 13.5677 105.48 19.0187 98.4884 23.1568C97.3468 17.7339 91.2109 5.68928 75.7998 0.894703C60.3887 -3.89987 49.9719 11.7406 46.6899 20.1602C29.5664 11.9409 15.5828 15.8793 10.7315 18.8759Z" fill="#0976FE"/>
            <g class="blob__eyes">
              <ellipse class="blob__eye" cx="34.6983" cy="97.1757" rx="10.7022" ry="14.1269" fill="white"/>
              <ellipse class="blob__eye" cx="66.377" cy="97.1757" rx="10.7022" ry="14.1269" fill="white"/>
            </g>
            <path class="blob__band" d="M11.9873 76.6285L11.129 65.9241C13.0064 61.2633 94.8166 58.853 135.519 57.309C144.602 48.9359 151.441 50.1642 153.725 51.825C157.451 55.8993 151.283 61.5885 147.734 63.9238C158.926 69.4485 156.609 74.1318 154.052 75.7829C145.121 80.1907 138.383 73.4013 136.131 69.4557C120.466 72.985 46.9573 74.8662 11.9873 76.6285Z" fill="#131313"/>
          </svg>
        </div>
      </div>
      <div class="blob blob--pink" id="blobPink" aria-hidden="true">
        <div class="blob__react">
          <svg class="blob__svg" viewBox="0 0 152 167" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="blob__spark" d="M125.141 18.4173C122.993 15.8516 108.015 18.3489 100.795 19.9182C113.498 25.0623 121.013 37.5445 123.182 43.1426C124.731 35.9699 127.29 20.983 125.141 18.4173Z" fill="#F6A9EA"/>
            <path class="blob__spark" d="M91.4756 1.75917C88.2584 0.837535 77.2509 11.2966 72.1493 16.6414C85.5531 13.7865 98.7708 19.9162 103.704 23.3379C100.968 16.529 94.6928 2.68081 91.4756 1.75917Z" fill="#F6A9EA"/>
            <path class="blob__spark" d="M145.074 43.6984C143.832 40.5908 128.822 38.2962 121.473 37.5373C131.939 46.3838 135.19 60.5864 135.507 66.5818C139.214 60.2489 146.316 46.806 145.074 43.6984Z" fill="#F6A9EA"/>
            <path class="blob__spark" d="M150.075 77.3262C150.117 73.9799 137.129 66.115 130.629 62.6009C136.913 74.7798 134.48 89.1451 132.478 94.8054C138.326 90.3733 150.033 80.6726 150.075 77.3262Z" fill="#F6A9EA"/>
            <path class="blob__body" d="M0.224946 72.4079C-3.61227 27.3207 42.5942 15.2494 66.177 14.8497C82.9662 13.3683 96.8745 17.1188 107.346 22.3068C122.46 29.7951 132.177 45.101 135.325 61.6723C144.743 111.251 96.4573 120.675 98.5534 122.771C100.952 125.17 106.947 155.148 105.748 163.542C104.853 169.807 88.5807 164.034 78.9373 159.661C77.6791 159.091 76.233 159.08 74.9348 159.552C49.8487 168.683 45.0129 139.126 45.7917 122.771C32.2016 124.77 4.06216 117.495 0.224946 72.4079Z" fill="#EC48D3"/>
            <g class="blob__eyes">
              <ellipse class="blob__eye" cx="28.5675" cy="64.8815" rx="9.19981" ry="14.526" fill="#FDFFFF"/>
              <ellipse class="blob__eye" cx="52.7779" cy="64.8815" rx="9.19981" ry="14.526" fill="#FDFFFF"/>
            </g>
          </svg>
        </div>
      </div>

      <div class="clouds" id="clouds" aria-hidden="true">
        <div class="clouds__left">
          <img class="clouds__img" src="assets/cloud-left.png" alt="" width="452" height="249" />
        </div>
        <div class="clouds__right">
          <img class="clouds__img" src="assets/cloud-right.png" alt="" width="402" height="197" />
        </div>
      </div>

      <h1 class="headline" id="headline">
        <span class="headline__line headline__line--dark">Shelter for</span>
        <span class="headline__line headline__line--blue">Design &amp; Interactions</span>
      </h1>
    </div>
  </main>

  <section class="work" id="showcase" aria-label="Selected work">
    <ul class="work__grid">
      <!-- Col 1, spans both rows — Instagram -->
      <li class="work-card work-card--tall" data-reveal-card data-node-id="1041:811">
        <div class="work-phone">
          <video class="work-phone__video" src="assets/Iphoneinsta.mov"
                 autoplay loop muted playsinline webkit-playsinline
                 preload="auto" aria-label="Instagram"></video>
        </div>
        <span class="work-label">Instagram</span>
      </li>

      <!-- Col 2, row 1 — Recharge -->
      <li class="work-card work-card--fill work-card--recharge work-card--interactive" data-reveal-card data-interaction="recharge" data-node-id="1041:818" role="button" tabindex="0" aria-label="Open Recharge interaction">
        <div class="work-card__fill-stage" aria-hidden="true">
          <video class="work-card__fill-video" src="assets/RECHARGEINT1.mov"
                 autoplay loop muted playsinline webkit-playsinline
                 preload="auto" aria-label="Recharge"></video>
        </div>
        <span class="work-label">Recharge</span>
      </li>

      <!-- Col 3, row 1 — Drag Orb -->
      <li class="work-card work-card--fill work-card--dragorb work-card--interactive" data-reveal-card data-interaction="dragorb" data-node-id="1041:825" role="button" tabindex="0" aria-label="Open Drag Orb interaction">
        <div class="work-card__fill-stage" aria-hidden="true">
          <video class="work-card__fill-video" src="assets/DRAGORB.mov"
                 autoplay loop muted playsinline webkit-playsinline
                 preload="auto" aria-label="Drag Orb"></video>
        </div>
        <span class="work-label">Drag Orb</span>
      </li>

      <!-- Col 2, row 2 — Scroller -->
      <li class="work-card work-card--fill work-card--scroller work-card--interactive" data-reveal-card data-interaction="scroller" data-node-id="1041:828" role="button" tabindex="0" aria-label="Open Scroller interaction">
        <div class="work-card__fill-stage" aria-hidden="true">
          <video class="work-card__fill-video" src="assets/SCROOLER1.mov"
                 autoplay loop muted playsinline webkit-playsinline
                 preload="auto" aria-label="Scroller"></video>
        </div>
        <span class="work-label">Scroller</span>
      </li>

      <!-- Col 3, row 2 — Calendar -->
      <li class="work-card work-card--fill work-card--calendar work-card--interactive" data-reveal-card data-interaction="calendar" data-node-id="1041:835" role="button" tabindex="0" aria-label="Open Calendar interaction">
        <div class="work-card__fill-stage" aria-hidden="true">
          <video class="work-card__fill-video" src="assets/Calenderint.mov"
                 autoplay loop muted playsinline webkit-playsinline
                 preload="auto" aria-label="Calendar"></video>
        </div>
        <span class="work-label">Calendar</span>
      </li>
    </ul>
  </section>

  <footer class="site-footer" aria-label="Site footer">
    <div class="footer" data-node-id="1062:678">
      <div class="footer__inner" data-node-id="1062:679">
        <div class="spheres" data-node-id="1062:680">
          <a class="sphere-wrap" href="https://atharvachavare.framer.website/" target="_blank" rel="noopener noreferrer" aria-label="Portfolio">
            <span class="sphere-chip">Portfolio</span>
            <img class="sphere" src="assets/footer/sphere-1-coral.png" alt="" width="72" height="72" data-node-id="1062:681" />
          </a>
          <a class="sphere-wrap" href="mailto:chavareatharva@gmail.com" aria-label="Email">
            <span class="sphere-chip">Email</span>
            <img class="sphere" src="assets/footer/sphere-2-teal.png" alt="" width="72" height="72" data-node-id="1062:789" />
          </a>
          <a class="sphere-wrap" href="https://www.linkedin.com/in/atharva-chavare-363278248/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <span class="sphere-chip">Linkedin</span>
            <img class="sphere" src="assets/footer/sphere-3-purple.png" alt="" width="72" height="72" data-node-id="1062:897" />
          </a>
          <a class="sphere-wrap" href="https://medium.com/@chavareatharva" target="_blank" rel="noopener noreferrer" aria-label="Medium">
            <span class="sphere-chip">Medium</span>
            <img class="sphere" src="assets/footer/sphere-4-orange.png" alt="" width="72" height="72" data-node-id="1062:1005" />
          </a>
          <a class="sphere-wrap" href="https://drive.google.com/file/d/12S-FZbnZsAvqbvHuWiF1VIkfM3SiJ1rv/view?usp=sharing" target="_blank" rel="noopener noreferrer" aria-label="Resume">
            <span class="sphere-chip">Resume</span>
            <img class="sphere" src="assets/footer/sphere-5-white.png" alt="" width="72" height="72" data-node-id="1062:1113" />
          </a>
          <a class="sphere-wrap" href="https://www.behance.net/atharvachavare" target="_blank" rel="noopener noreferrer" aria-label="Behance">
            <span class="sphere-chip">Behance</span>
            <img class="sphere" src="assets/footer/sphere-6-pink.png" alt="" width="72" height="72" data-node-id="1062:1321" />
          </a>
        </div>
        <p class="credit" id="footerCredit" aria-label="Crafted By @Atharva Chavare">Crafted By @Atharva Chavare</p>
      </div>
    </div>
  </footer>

  <div class="interaction-sheet" id="interactionSheet" aria-hidden="true">
    <div class="interaction-sheet__backdrop" data-sheet-close tabindex="-1" aria-hidden="true"></div>
    <div
      class="interaction-sheet__panel"
      id="interactionSheetPanel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="interactionSheetTitle"
      tabindex="-1"
    >
      <div class="interaction-sheet__handle" id="interactionSheetHandle" role="button" tabindex="0" aria-label="Drag to resize or close"></div>
      <div class="interaction-sheet__content">
        <h2 class="interaction-sheet__title" id="interactionSheetTitle"></h2>
        <ul class="interaction-sheet__chips" id="interactionChips" aria-label="Tools used"></ul>
        <div class="interaction-sheet__stage">
          <div class="interaction-sheet__mount" id="interactionMount"></div>
        </div>
      </div>
    </div>
    <div class="sheet-close-cursor" id="sheetCloseCursor" aria-hidden="true">
      <div class="sheet-close-cursor__icon">
        <img src="assets/sheet-close-cursor.svg" alt="" width="31" height="31" />
      </div>
    </div>
  </div>
</body>
</html>
